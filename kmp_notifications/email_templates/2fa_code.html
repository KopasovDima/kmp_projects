<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Код подтверждения для входа</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .content {
            background-color: #f9f9f9;
            padding: 25px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .codeContainer {
            text-align: center;
            justify-content: center;
            display: flex;
        }
        .code {
            padding: 12px 2px;
            font-size: 26px;
        }
        .codePart1 {
            margin-left: 5px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="content">
        <h2>Код подтверждения для входа</h2>
        <p>Подтвердите вход с помощью кода ниже:</p>

        <div class="codeContainer">
            <b class="code">
                <span class="codePart1">{{verification_code_part1}}</span><span class="codePart1">{{verification_code_part2}}</span><span class="codePart1">{{verification_code_part3}}</span>
            </b>
        </div>

        <p>Если вы не входили на сайт, необходимо сменить пароль.</p>

        <p>Этот код действителен в течение 10 минут.</p>
    </div>
</body>
</html>
